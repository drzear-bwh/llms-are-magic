<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hotel Moonbeam: a breakfast adventure about how large language models work, for your phone.">
<title>Hotel Moonbeam</title>
<link rel="icon" href="media/moon.svg" type="image/svg+xml">
<link rel="preload" href="vendor/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="gate" id="gate" hidden>
  <div class="window">
    <p class="kicker">Check-in</p>
    <h1>Hotel Moonbeam</h1>
    <p>Good morning! Your booking reference, please.</p>
    <form id="gateForm">
      <label for="pw">Booking reference</label>
      <input id="pw" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
      <button class="btn primary block" id="gateBtn">Check in</button>
    </form>
    <p class="small" id="gateMsg" aria-live="polite">David will tell you the booking reference. Capitals don't matter.</p>
  </div>
</main>
<noscript><p class="gate">This site needs JavaScript.</p></noscript>
<script type="module" src="unlock.js"></script>
</body>
</html>
